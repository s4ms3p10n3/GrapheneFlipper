kind: pipeline
type: docker
name: Release firmware
platform:
  os: linux
  arch: amd64
clone:
  depth: 1
steps:
- name: Update submodules
  image: alpine/git
  commands:
  - git submodule sync
  - git -c protocol.version=2 submodule update --init --force --recursive --depth 1 --jobs 4
  - git submodule foreach git config --local gc.auto 0
  - git log -1 --format='%H'
- name: Provide ccache
  image: debian:bookworm-slim
  volumes:
  - name: fbt-toolchain
    path: /fbt
  commands:
  - if [ -x /fbt/bin/ccache ]; then /fbt/bin/ccache -V | head -1; exit 0; fi
  - apt-get update -qq
  - apt-get install -y -qq --no-install-recommends ca-certificates wget xz-utils
  - wget -qO /tmp/ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz
  - tar xJf /tmp/ccache.tar.xz -C /tmp
  - mkdir -p /fbt/bin
  - cp /tmp/ccache-4.10.2-linux-x86_64/ccache /fbt/bin/ccache
  - chmod 755 /fbt/bin/ccache
  - /fbt/bin/ccache -V | head -1
- name: Build clean
  image: hfdj/fztools
  pull: never
  commands:
  - export DIST_SUFFIX=${DRONE_TAG}c
  - export WORKFLOW_BRANCH_OR_TAG=release-cfw
  - export FORCE_NO_DIRTY=yes
  - export FBT_GIT_SUBMODULE_SHALLOW=1
  - find applications/main/extra_resources/resources/apps/ -mindepth 1 -maxdepth 1 ! -name Scripts -exec rm -rf {} +
  - rm -rf build/
  - rm -rf dist/
  - rm -rf .sconsign.dblite
  - mkdir -p /ccache "$HOME/.config/ccache" "$HOME/.ccache"
  - printf 'cache_dir = /ccache\nmax_size = 10G\ncompression = true\n' | tee /ccache/ccache.conf "$HOME/.config/ccache/ccache.conf"
    > "$HOME/.ccache/ccache.conf"
  - if /fbt/bin/ccache -V >/dev/null 2>&1; then export PATH=/fbt/bin:$PATH; ccache -V | head -1; else echo "WARNING ccache
    unusable - building without cache"; fi
  - echo "cores - nproc $(nproc) / cgroup $(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo n/a)"
  - ccache -p 2>/dev/null | grep -E "cache_dir|max_size" || true
  - echo "--- ccache stats BEFORE ---"; ccache -s 2>/dev/null | head -6 || true
  - echo "T $(date -u +%T) fbt start"
  - rc=0; ./fbt -j "$(nproc)" COMPACT=1 DEBUG=0 updater_package > /tmp/fbt.log 2>&1 || rc=$?; grep -E "warning:|error:|Error
    [0-9]|\*\*\*|FAILED|StopError|undefined reference" /tmp/fbt.log || echo "no warnings or errors"; echo "fbt log lines $(wc
    -l < /tmp/fbt.log)"; [ $rc -eq 0 ] || { echo "BUILD FAILED"; tail -80 /tmp/fbt.log; exit $rc; }
  - echo "T $(date -u +%T) fbt done"
  - echo "--- ccache stats AFTER ---"; ccache -s 2>/dev/null | head -14 || true
  - du -sh /ccache 2>/dev/null || true
  - mkdir artifacts-clean
  - mv dist/f7-C/* artifacts-clean/
  - ls -laS artifacts-clean
  - ls -laS artifacts-clean/f7-update-${DRONE_TAG}c
  environment:
    FBT_TOOLCHAIN_PATH: /fbt
    FBT_NO_SYNC: 1
    CCACHE_DIR: /ccache
    FBT_TOOLS_CUSTOM_LINK:
      from_secret: fbt_link
  volumes:
  - name: ccache
    path: /ccache
  - name: fbt-toolchain
    path: /fbt
- name: Build default
  image: hfdj/fztools
  pull: never
  commands:
  - export DIST_SUFFIX=${DRONE_TAG}
  - export WORKFLOW_BRANCH_OR_TAG=release-cfw
  - export FORCE_NO_DIRTY=yes
  - export FBT_GIT_SUBMODULE_SHALLOW=1
  - wget https://github.com/xMasterX/all-the-plugins/releases/latest/download/all-the-apps-base.tgz
  - tar zxf all-the-apps-base.tgz
  - mkdir -p applications/main/extra_resources/resources/apps
  - mkdir -p applications/main/extra_resources/resources/apps_data
  - cp -R base_pack_build/artifacts-base/* applications/main/extra_resources/resources/apps/
  - cp -R base_pack_build/apps_data/* applications/main/extra_resources/resources/apps_data/
  - rm -rf base_pack_build
  - rm -rf all-the-apps-base.tgz
  - rm -f build/f7-firmware-C/toolbox/version.*
  - mkdir -p /ccache "$HOME/.config/ccache" "$HOME/.ccache"
  - printf 'cache_dir = /ccache\nmax_size = 10G\ncompression = true\n' | tee /ccache/ccache.conf "$HOME/.config/ccache/ccache.conf"
    > "$HOME/.ccache/ccache.conf"
  - if /fbt/bin/ccache -V >/dev/null 2>&1; then export PATH=/fbt/bin:$PATH; ccache -V | head -1; else echo "WARNING ccache
    unusable - building without cache"; fi
  - echo "cores - nproc $(nproc) / cgroup $(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo n/a)"
  - ccache -p 2>/dev/null | grep -E "cache_dir|max_size" || true
  - echo "--- ccache stats BEFORE ---"; ccache -s 2>/dev/null | head -6 || true
  - echo "T $(date -u +%T) fbt start"
  - rc=0; ./fbt -j "$(nproc)" COMPACT=1 DEBUG=0 updater_package > /tmp/fbt.log 2>&1 || rc=$?; grep -E "warning:|error:|Error
    [0-9]|\*\*\*|FAILED|StopError|undefined reference" /tmp/fbt.log || echo "no warnings or errors"; echo "fbt log lines $(wc
    -l < /tmp/fbt.log)"; [ $rc -eq 0 ] || { echo "BUILD FAILED"; tail -80 /tmp/fbt.log; exit $rc; }
  - echo "T $(date -u +%T) fbt done"
  - echo "--- ccache stats AFTER ---"; ccache -s 2>/dev/null | head -14 || true
  - du -sh /ccache 2>/dev/null || true
  - mkdir artifacts-default
  - mv dist/f7-C/* artifacts-default/
  - ls -laS artifacts-default
  - ls -laS artifacts-default/f7-update-${DRONE_TAG}
  environment:
    FBT_TOOLCHAIN_PATH: /fbt
    FBT_NO_SYNC: 1
    CCACHE_DIR: /ccache
    FBT_TOOLS_CUSTOM_LINK:
      from_secret: fbt_link
  volumes:
  - name: ccache
    path: /ccache
  - name: fbt-toolchain
    path: /fbt
- name: Build with extra apps
  image: hfdj/fztools
  pull: never
  commands:
  - wget https://github.com/xMasterX/all-the-plugins/releases/latest/download/all-the-apps-extra.tgz
  - tar zxf all-the-apps-extra.tgz
  - mkdir -p applications/main/extra_resources/resources/apps
  - cp -R extra_pack_build/artifacts-extra/* applications/main/extra_resources/resources/apps/
  - rm -rf extra_pack_build
  - export DIST_SUFFIX=${DRONE_TAG}e
  - export WORKFLOW_BRANCH_OR_TAG=release-cfw
  - export FORCE_NO_DIRTY=yes
  - export FBT_GIT_SUBMODULE_SHALLOW=1
  - rm -f build/f7-firmware-C/toolbox/version.*
  - mkdir -p /ccache "$HOME/.config/ccache" "$HOME/.ccache"
  - printf 'cache_dir = /ccache\nmax_size = 10G\ncompression = true\n' | tee /ccache/ccache.conf "$HOME/.config/ccache/ccache.conf"
    > "$HOME/.ccache/ccache.conf"
  - if /fbt/bin/ccache -V >/dev/null 2>&1; then export PATH=/fbt/bin:$PATH; ccache -V | head -1; else echo "WARNING ccache
    unusable - building without cache"; fi
  - echo "cores - nproc $(nproc) / cgroup $(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo n/a)"
  - ccache -p 2>/dev/null | grep -E "cache_dir|max_size" || true
  - echo "--- ccache stats BEFORE ---"; ccache -s 2>/dev/null | head -6 || true
  - echo "T $(date -u +%T) fbt start"
  - rc=0; ./fbt -j "$(nproc)" COMPACT=1 DEBUG=0 updater_package > /tmp/fbt.log 2>&1 || rc=$?; grep -E "warning:|error:|Error
    [0-9]|\*\*\*|FAILED|StopError|undefined reference" /tmp/fbt.log || echo "no warnings or errors"; echo "fbt log lines $(wc
    -l < /tmp/fbt.log)"; [ $rc -eq 0 ] || { echo "BUILD FAILED"; tail -80 /tmp/fbt.log; exit $rc; }
  - echo "T $(date -u +%T) fbt done"
  - echo "--- ccache stats AFTER ---"; ccache -s 2>/dev/null | head -14 || true
  - du -sh /ccache 2>/dev/null || true
  - mkdir artifacts-extra-apps
  - mv dist/f7-C/* artifacts-extra-apps/
  - ls -laS artifacts-extra-apps
  - ls -laS artifacts-extra-apps/f7-update-${DRONE_TAG}e
  - sed -i 's/(version)/'${DRONE_TAG}'/g' CHANGELOG.md
  environment:
    FBT_TOOLCHAIN_PATH: /fbt
    FBT_NO_SYNC: 1
    CCACHE_DIR: /ccache
    FBT_TOOLS_CUSTOM_LINK:
      from_secret: fbt_link
  volumes:
  - name: ccache
    path: /ccache
  - name: fbt-toolchain
    path: /fbt
- name: Bundle self-update packages
  image: joshkeegan/zip
  commands:
  - cp artifacts-extra-apps/flipper-z-f7-update-${DRONE_TAG}e.tgz .
  - cp artifacts-clean/flipper-z-f7-update-${DRONE_TAG}c.tgz .
  - cp artifacts-default/flipper-z-f7-update-${DRONE_TAG}.tgz .
  - zip -r artifacts-extra-apps/flipper-z-f7-update-${DRONE_TAG}e.zip artifacts-extra-apps/f7-update-${DRONE_TAG}e
  - zip -r artifacts-clean/flipper-z-f7-update-${DRONE_TAG}c.zip artifacts-clean/f7-update-${DRONE_TAG}c
  - zip -r artifacts-default/flipper-z-f7-update-${DRONE_TAG}.zip artifacts-default/f7-update-${DRONE_TAG}
  - tar czpf artifacts-default/flipper-z-any-scripts-${DRONE_TAG}.tgz scripts
  - rm -rf artifacts-extra-apps/f7-update-${DRONE_TAG}
  - rm -rf artifacts-clean/f7-update-${DRONE_TAG}
  - rm -rf artifacts-default/f7-update-${DRONE_TAG}
  - ls -laS artifacts-extra-apps
  - ls -laS artifacts-clean
  - ls -laS artifacts-default
  - mv artifacts-default/ ${DRONE_TAG}
  - ls -laS ${DRONE_TAG}
- name: Publish GitHub release
  image: plugins/github-release
  settings:
    api_key:
      from_secret: github_apikey
    files:
    - ${DRONE_TAG}/*.tgz
    - ${DRONE_TAG}/*.zip
    - artifacts-extra-apps/*.tgz
    - artifacts-extra-apps/*.zip
    - artifacts-clean/*.tgz
    - artifacts-clean/*.zip
    title: ${DRONE_TAG}
    note: CHANGELOG.md
    prerelease: false
    checksum:
    - md5
    - sha1
    - crc32
volumes:
- name: ccache
  host:
    path: /var/lib/drone/cache/unleashed-ccache
- name: fbt-toolchain
  host:
    path: /var/lib/drone/cache/fbt-toolchain
trigger:
  event:
  - tag
  ref:
    exclude:
    - refs/tags/dev-*
